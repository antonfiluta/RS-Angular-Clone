@for (city of citiesOffers(); track city.name + '-' + $index) {
  <div>
    <a [routerLink]="['/offers', city.name]">
      <h2 class="font-medium text-xl tracking-wider mb-3 flex items-center">
        <span> {{ 'OFFERS.POPULAR' | translate }} {{ city.name }} </span>
        <i class="pi pi-angle-right pt-[3px]" style="font-size: 18px"></i>
      </h2>
    </a>
    <app-offers-overview-list
      [cityOffers]="city.offers"
      [cityName]="city.name"
    ></app-offers-overview-list>
  </div>
} @empty {
  <h2>{{ 'OFFERS.EMPTY' | translate }}</h2>
}
