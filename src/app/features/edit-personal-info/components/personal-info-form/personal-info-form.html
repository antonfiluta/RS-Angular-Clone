<form [formGroup]="form" class="block">
  <div class="p-0 m-0 bg-white rounded-xl max-w-full shadow-lg">
    <!-- Avatar row -->
    <div class="flex items-center gap-4 px-6 py-5 border-b border-gray-200">
      <img
        src="assets/images/avatar-placeholder.svg"
        alt="Avatar"
        class="w-20 h-20 rounded-full object-cover bg-gray-100"
      />
      <button
        type="button"
        class="text-gray-900 underline bg-transparent border-0 cursor-pointer font-normal"
        aria-label="Change avatar"
      >
        Change
      </button>
    </div>
    <app-profile-row
      *ngFor="let field of formFields"
      [title]="field.title"
      [fieldKey]="field.key"
      [control]="getControl(field.key)"
      [empty]="isEmpty(field.key)"
      [actionLabel]="getActionLabel(field.key)"
      [isEditing]="editFieldName === field.key"
      [sub]="field.sub"
      [type]="field.type || 'text'"
      [options]="field.options || []"
      (editField)="editField($event)"
      (saveField)="saveField($event)"
      (cancelEdit)="cancelEdit($event)"
    ></app-profile-row>
  </div>
</form>
