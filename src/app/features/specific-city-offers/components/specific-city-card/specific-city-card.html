<img
  [src]="offer().photos[0].url"
  [alt]="offer().photos[0].id"
  class="size-[55vw] sm:size-[35vw] md:size-[25vw] lg:size-[20vw] xl:size-[15vw] object-cover rounded-2xl"
/>

<div class="flex flex-col px-1">
  <h3 class="text-[13px] font-medium">{{ offer().title }}</h3>
  <p class="text-[12px] text-brand-gray">
    {{ offer().address | addressFormat }} / {{ offer().description }}
  </p>
  <div class="text-brand-gray text-[12px] tracking-wide flex items-center justify-between gap-1">
    <span>{{ offer().pricing.weekdayPrice }}$ {{ 'OFFERS.TERM' | translate }}</span>
    <span>
      <i class="pi pi-star-fill" style="font-size: 12px"></i>
      {{ offer().averageRating }}
    </span>
  </div>
</div>

@if (offer().isFavorite) {
  <span class="absolute top-2 left-2 bg-brand-light-gray text-[12px] px-2 py-1 rounded-xl">
    {{ 'OFFERS.FAVORITE' | translate }}
  </span>
}

<div
  class="absolute top-2 right-4 drop-shadow-[1px_1px_3px_white,-1px_-1px_2px_white] hover:scale-110 duration-200"
>
  <span class="mask mask-heart bg-black/65 w-5 h-5" [class.bg-brand-red]="false"></span>
</div>
