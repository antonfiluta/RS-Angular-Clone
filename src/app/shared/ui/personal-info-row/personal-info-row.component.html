<section class="flex justify-between items-start px-6 py-5 border-b border-gray-200">
  <div class="flex-1">
    <div class="text-xl font-bold text-gray-900 mb-1.5">{{ title }}</div>
    <div *ngIf="sub" class="text-gray-500 text-sm mt-1">{{ sub }}</div>

    <!-- View mode -->
    <div *ngIf="!isEditing" class="text-gray-900 text-base mt-1.5" [class.text-gray-400]="empty">
      {{ empty ? 'Not provided' : control.value }}
    </div>

    <!-- Edit mode -->
    <div *ngIf="isEditing">
      <div [ngSwitch]="type">
        <input
          *ngSwitchDefault
          [type]="type"
          class="input input-bordered w-full rounded-xl px-4 py-3.5 text-base"
          [class.border-red-500]="isFieldInvalid"
          [formControl]="control"
          [placeholder]="title"
          [attr.aria-label]="title"
        />

        <select
          *ngSwitchCase="'select'"
          class="select select-bordered w-full rounded-xl text-base"
          [class.border-red-500]="isFieldInvalid"
          [formControl]="control"
        >
          <option value="">Select {{ title.toLowerCase() }}</option>
          <option *ngFor="let opt of options" [value]="opt">{{ opt }}</option>
        </select>

        <input
          *ngSwitchCase="'date'"
          type="date"
          class="input input-bordered w-full rounded-xl px-4 py-3.5 text-base"
          [class.border-red-500]="isFieldInvalid"
          [formControl]="control"
          [attr.aria-label]="title"
        />
      </div>

      <div *ngIf="isFieldInvalid" class="text-red-500 text-sm mt-1">
        {{ errorMessage }}
      </div>

      <div class="mt-4">
        <button
          type="button"
          class="bg-gray-900 text-white rounded-lg px-4 py-2.5 border-0 cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed"
          [disabled]="isFieldInvalid || control.pristine"
          (click)="saveField.emit(fieldKey)"
        >
          Save
        </button>
      </div>
    </div>
  </div>

  <!-- Right action buttons -->
  <div class="ml-4 flex-none flex items-center">
    <button
      *ngIf="!isEditing"
      type="button"
      class="text-gray-900 underline bg-transparent border-0 cursor-pointer font-normal"
      (click)="editField.emit(fieldKey)"
    >
      {{ actionLabel }}
    </button>
    <button
      *ngIf="isEditing"
      type="button"
      class="text-gray-900 underline bg-transparent border-0 cursor-pointer font-normal"
      (click)="cancelEdit.emit(fieldKey)"
    >
      Cancel
    </button>
  </div>
</section>
