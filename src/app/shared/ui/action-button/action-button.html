<button
  [disabled]="isDisabled()"
  [ngClass]="{
    'bg-gray-900 text-white': isDark(),
    'text-brand-dark': !isDark(),
  }"
  class="border-2 hover:text-brand-bg border-brand-dark px-3 py-1 rounded-lg cursor-pointer flex items-center gap-2 hover:bg-gray-800 active:scale-95 transition-all duration-200 font-medium disabled:bg-gray-400 disabled:cursor-not-allowed disabled:opacity-60"
>
  <i class="pi pi-{{ icon() }}"></i>
  <span>{{ content() }}</span>
</button>
