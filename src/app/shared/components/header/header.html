<h1 class="header__title">
  <a routerLink="/" class="header__title__link">
    <img src="assets/images/logo-icon.png" alt="airbnb icon" class="header__title__icon" />
    <span>airbnb</span>
  </a>
</h1>

<div class="header__buttons">
  <!-- Language Dropdown -->
  <div class="dropdown">
    <button class="header__button" (click)="toggleLanguageMenu()">
      <i class="pi pi-globe header__button__icon"></i>
    </button>

    @if (languageMenuOpen) {
      <ul class="dropdown__menu">
        @for (lang of languages; track lang.code) {
          <li
            [class]="
              'dropdown__link ' +
              (currentLanguage === lang.code ? 'bg-blue-50' : 'hover:bg-gray-50')
            "
          >
            <button (click)="selectLanguage(lang.code)">
              <span class="language-flag-emoji">{{ lang.flag }}</span>
              {{ lang.name }}
            </button>
          </li>
        }
      </ul>
    }
  </div>

  <!-- User Button -->
  <a routerLink="/profile" class="header__button header__button--link" (click)="closeAllMenus()">
    <i class="pi pi-user header__button__icon"></i>
  </a>

  <!-- Menu Dropdown -->
  <div class="dropdown">
    <button class="header__button" (click)="toggleMenu()">
      <i class="pi pi-bars header__button__icon"></i>
    </button>

    @if (menuOpen) {
      <ul class="dropdown__menu">
        <li class="dropdown__link hover:bg-gray-50">
          <a routerLink="/personal-info" (click)="closeAllMenus()">
            {{ 'MENU.PERSONAL_INFORMATION' | translate }}
          </a>
        </li>
        <li class="dropdown__link hover:bg-gray-50">
          <a routerLink="/auth/login" (click)="closeAllMenus()">
            {{ 'MENU.AUTHENTICATION' | translate }}
          </a>
        </li>
      </ul>
    }
  </div>
</div>

<div
  class="menu-overlay"
  [class.show]="menuOpen || languageMenuOpen"
  (click)="closeAllMenus()"
  role="presentation"
  aria-hidden="true"
></div>
