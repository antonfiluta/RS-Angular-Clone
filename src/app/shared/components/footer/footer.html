<div class="w-full flex flex-row flex-wrap items-center justify-between gap-4">
  <!-- GitHub Button + Dropdown -->
  <div class="relative github-dropdown-wrapper">
    <button
      type="button"
      (click)="toggleGitHubList()"
      (keydown)="onKeydown($event)"
      [attr.aria-label]="getTooltipText()"
      [attr.aria-expanded]="isGitHubListVisible"
      aria-haspopup="true"
      class="flex items-center justify-center w-12 h-12 rounded-lg border transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 active:translate-y-0.5 cursor-pointer"
      style="
        background-color: transparent;
        border-color: var(--color-border);
        color: var(--color-text-secondary);
        --tw-ring-color: var(--color-border-focus);
      "
    >
      <i class="pi pi-github text-2xl"></i>
    </button>
    <!-- Dropdown above -->
    <div
      class="absolute bottom-14 left-0 rounded-lg border z-10 flex flex-col gap-3 overflow-hidden transition-all duration-300 min-w-[12rem]"
      [class]="
        isGitHubListVisible
          ? 'opacity-100 visible p-4 h-auto translate-y-0'
          : 'opacity-0 invisible p-0 h-0 -translate-y-2'
      "
      style="
        background-color: var(--color-brand-bg-card);
        border-color: var(--color-border);
        box-shadow: var(--shadow-lg);
      "
      role="menu"
      [attr.aria-hidden]="!isGitHubListVisible"
    >
      @for (author of authors; track author.name) {
        <a
          [href]="author.github"
          target="_blank"
          rel="noopener noreferrer"
          class="flex items-center gap-2 p-2 rounded text-sm whitespace-nowrap transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2"
          style="color: var(--color-text-primary); --tw-ring-color: var(--color-border-focus)"
          role="menuitem"
          onmouseenter="this.style.backgroundColor = 'var(--color-brand-bg-hover)'; this.style.color = 'var(--color-border-focus)'"
          onmouseleave="this.style.backgroundColor = 'transparent'; this.style.color = 'var(--color-text-primary)'"
        >
          <i class="pi pi-github" style="color: var(--color-text-secondary)"></i>
          <span>{{ author.name }}</span>
        </a>
      }
    </div>
  </div>
  <!-- Copyright -->
  <div class="flex-1 text-center text-sm sm:text-base" style="color: var(--color-text-secondary)">
    <span
      >&copy; {{ currentYear }} {{ 'FOOTER.COPYRIGHT' | translate }} Airbnb RS Angular Clone</span
    >
  </div>

  <!-- RS School Logo -->
  <a
    href="https://rs.school/courses/angular"
    target="_blank"
    rel="noopener noreferrer"
    [attr.aria-label]="'FOOTER.RS_SCHOOL_LINK' | translate"
    class="flex items-center justify-center w-12 h-12 rounded-lg border transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 active:translate-y-0.5"
    style="
      background-color: transparent;
      border-color: var(--color-border);
      color: var(--color-text-secondary);
      --tw-ring-color: var(--color-border-focus);
    "
  >
    <img
      src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
      alt="RS School Angular"
      class="h-8 w-auto"
    />
  </a>
</div>
