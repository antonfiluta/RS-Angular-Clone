<div class="w-full h-screen flex items-center justify-center p-5">
  <div class="bg-white rounded-2xl p-12 text-center max-w-md w-full shadow-2xl animate-fade-in-up">
    <!-- Error Icon -->
    <div class="w-20 h-20 mx-auto mb-6">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
        <circle cx="12" cy="12" r="10" stroke="#FF5A5F" stroke-width="2" />
        <path
          d="m15 9-6 6"
          stroke="#FF5A5F"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="m9 9 6 6"
          stroke="#FF5A5F"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <!-- Error Code -->
    <h1 class="text-6xl font-bold text-rose-500 mb-4">404</h1>

    <!-- Error Message -->
    <h2 class="text-2xl font-semibold text-gray-700 mb-4">Page Not Found</h2>

    <!-- Error Description -->
    <p class="text-base text-gray-500 mb-8">We can't seem to find the page you're looking for.</p>

    <!-- Action Buttons -->
    <div class="flex flex-col space-y-3 md:flex-row md:space-y-0 md:space-x-3 md:justify-center">
      <a
        routerLink="/"
        class="px-6 py-3 bg-rose-500 text-white font-semibold rounded-lg hover:bg-rose-600 hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-rose-500 focus:ring-offset-2 text-center no-underline"
      >
        Go to Homepage
      </a>

      <button
        class="px-6 py-3 bg-gray-100 text-gray-700 font-semibold rounded-lg border border-gray-300 hover:bg-gray-50 hover:-translate-y-0.5 transition-all duration-200 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2"
        (click)="goBack()"
      >
        Go Back
      </button>
    </div>
  </div>
</div>
