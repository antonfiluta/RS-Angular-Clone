<div class="w-full h-screen flex items-center justify-center p-5">
  <div class="bg-white rounded-2xl p-12 text-center max-w-md w-full shadow-2xl animate-fade-in-up">
    <!-- Error Icon -->
    <div class="w-20 h-20 mx-auto mb-6">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
        <circle cx="12" cy="12" r="10" stroke="#ff385c" stroke-width="2" />
        <path
          d="m15 9-6 6"
          stroke="#ff385c"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path
          d="m9 9 6 6"
          stroke="#ff385c"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
    </div>

    <!-- Error Code -->
    <h1
      class="uppercase tracking-wider font-bold text-brand-red mb-1 text-6xl text-shadow-[1px_1px_0_black]"
    >
      404
    </h1>

    <!-- Error Message -->
    <h2
      class="uppercase tracking-wider font-bold text-brand-red mb-4 text-2xl text-shadow-[1px_1px_0_black]"
    >
      {{ 'ERROR.PAGE_NOT_FOUND' | translate }}
    </h2>

    <!-- Error Description -->
    <p class="text-base text-gray-500 mb-8">{{ 'ERROR.PAGE_NOT_FOUND_DESCRIPTION' | translate }}</p>

    <!-- Action Buttons -->
    <div class="flex justify-center gap-5 mt-7">
      <button class="btn btn-outline btn-error" (click)="goBack()">
        {{ 'ERROR.GO_BACK' | translate }}
      </button>

      <a routerLink="/" class="btn btn-outline btn-success no-underline">
        {{ 'ERROR.GO_HOME' | translate }}
      </a>
    </div>
  </div>
</div>
